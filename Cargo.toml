[workspace]
members = [
  "crates/mallow-core",
  "crates/mallow-cli",
  "crates/mallow-luau-toolchain",
  "crates/mallow-test-macros",
  "xtask",
]
resolver = "3"

[workspace.package]
version = "0.4.3"
edition = "2024"
license = "AGPL-3.0-only"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
either = "1.15.0"
id-arena = "2.3.0"
libtest-mimic = "0.8.2"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
smallvec = "1.15.1"
smol_str = "0.3.5"
tempfile = "3.26.0"
tracing = "0.1.41"
tracing-chrome = "0.7.2"
tracing-subscriber = "0.3.22"
