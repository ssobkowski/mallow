[package]
name = "mallow"
version = "0.4.1"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
clap = { version = "4.5.60", features = ["derive"] }
either = "1.15.0"
id-arena = "2.3.0"
serde = { version = "1.0.228", features = ["derive"], optional = true }
serde_json = { version = "1.0.149", optional = true }
smallvec = "1.15.1"
smol_str = "0.3.5"
tracing = "0.1.41"
tracing-chrome = { version = "0.7.2", optional = true }
tracing-subscriber = "0.3.22"

[dev-dependencies]
libtest-mimic = "0.8.2"
tempfile = "3.26.0"

[features]
default = []
profile = ["dep:tracing-chrome"]
visualize = ["dep:serde", "dep:serde_json"]

[[test]]
name = "decompiler"
harness = false
