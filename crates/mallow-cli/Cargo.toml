[package]
name = "mallow-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true

[[bin]]
name = "mallow"
path = "src/main.rs"

[dependencies]
mallow-core = { path = "../mallow-core" }
mallow-luau-toolchain = { path = "../mallow-luau-toolchain", optional = true }

anyhow.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-chrome = { workspace = true, optional = true }
tracing-subscriber.workspace = true

[features]
default = []
luau-toolchain = ["dep:mallow-luau-toolchain"]
profile = ["dep:tracing-chrome"]
visualize = ["mallow-core/visualize"]
